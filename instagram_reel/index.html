<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instagram reel generator</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('generator-theme') === 'light' ? 'light' : 'dark';
    } catch {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    :root {
      color-scheme: dark;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --accent: #fd1d1d;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --glass-bg: rgba(255,255,255,0.76);
      --glass-border: rgba(55,20,55,0.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0d080d;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(131,58,180,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(253,29,29,0.08) 0%, transparent 60%);
      min-height: 100vh;
      font-family: 'Roboto', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      color: #eae6ea;
    }
    :root[data-theme="light"] body {
      background: #faf5fa;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(131,58,180,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(253,29,29,0.08) 0%, transparent 60%);
      color: #2b242b;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    /* ---- Glass panel ---- */
    .glass-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ---- Input fields ---- */
    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #eae6ea;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field-input::placeholder { color: rgba(255,255,255,0.25); }
    .field-input:focus {
      border-color: rgba(214,41,118,0.6);
      background: rgba(214,41,118,0.06);
      box-shadow: 0 0 0 3px rgba(214,41,118,0.12);
    }
    textarea.field-input { resize: vertical; min-height: 64px; }

    /* ---- File input ---- */
    .file-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input::file-selector-button {
      background: rgba(214,41,118,0.2);
      border: 1px solid rgba(214,41,118,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #ff8ac2;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.2s;
    }
    .file-input::file-selector-button:hover {
      background: rgba(214,41,118,0.35);
    }

    /* ---- Buttons ---- */
    .btn-primary {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-apply {
      background: linear-gradient(135deg, #833ab4, #fd1d1d 60%, #fcb045);
      color: #fff;
      box-shadow: 0 4px 16px rgba(214,41,118,0.3);
    }
    .btn-apply:hover {
      box-shadow: 0 6px 20px rgba(214,41,118,0.45);
      transform: translateY(-1px);
    }
    .btn-save {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .btn-save:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ---- Label ---- */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    /* ---- Divider ---- */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 16px 0;
    }

    .panel-title { color: rgba(255,255,255,0.9); }
    .help-text { color: rgba(255,255,255,0.25); }
    .theme-toggle {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 36px; padding: 7px 9px; border: 1px solid var(--glass-border);
      border-radius: 9px; background: rgba(255,255,255,0.07); color: inherit;
      font-size: 11px; cursor: pointer;
    }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    :root[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(43,36,43,0.2); }
    :root[data-theme="light"] .field-input,
    :root[data-theme="light"] .file-input {
      background: rgba(255,255,255,0.82); border-color: rgba(55,20,55,0.13); color: #2b242b;
    }
    :root[data-theme="light"] .field-input::placeholder { color: rgba(43,36,43,0.38); }
    :root[data-theme="light"] .file-input { color: rgba(43,36,43,0.62); }
    :root[data-theme="light"] .field-label,
    :root[data-theme="light"] .help-text { color: rgba(43,36,43,0.55); }
    :root[data-theme="light"] .panel-title { color: #2b242b; }
    :root[data-theme="light"] .divider { border-color: rgba(55,20,55,0.1); }
    :root[data-theme="light"] .theme-toggle { background: rgba(55,20,55,0.06); }
    :root[data-theme="light"] .btn-save {
      background: rgba(255,255,255,0.7); border-color: rgba(55,20,55,0.13); color: rgba(43,36,43,0.75);
    }
    :root[data-theme="light"] .btn-save:hover { background: #fff; color: #2b242b; }

    /* =====================================================
       Instagram Reel card
       リール UI は本物準拠の固定配色(白文字+グラデスクリム)。
       テーマ切替はフォーム側にのみ適用する。
       ===================================================== */
    .reel-card {
      width: 320px;
      max-width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      background: #000;
      color: #ffffff;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.6),
        0 1px 0 rgba(255,255,255,0.08) inset;
    }

    .reel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }

    /* 上下のグラデーションスクリム */
    .reel-scrim-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 22%;
      background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 100%);
    }
    .reel-scrim-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 42%;
      background: linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.25) 55%, transparent 100%);
    }

    /* ---- Top bar ---- */
    .reel-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 0;
    }
    .reel-topbar .reel-heading {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .reel-topbar svg {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
    }

    /* ---- Right action rail ---- */
    .reel-rail {
      position: absolute;
      right: 10px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .rail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .rail-item svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45));
    }
    .rail-count {
      font-size: 11px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      font-variant-numeric: tabular-nums;
    }
    .rail-audio {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid #fff;
      background-size: cover;
      background-position: center;
      background-color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
      margin-top: 2px;
    }

    /* ---- Bottom info ---- */
    .reel-bottom {
      position: absolute;
      left: 12px;
      right: 56px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .reel-user {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .reel-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.9);
      background-size: cover;
      background-position: center;
      background-color: #333;
      flex-shrink: 0;
    }
    .reel-username {
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reel-caption {
      font-size: 12.5px;
      line-height: 1.45;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }
    .reel-audio-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .reel-audio-row svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }
    .reel-audio-name {
      font-size: 12px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .maker-layout { flex-direction: column; gap: 16px; padding: 16px; }
      .side-panel { position: static !important; width: 100% !important; max-width: 340px; border-radius: 16px; border: 1px solid var(--glass-border); }
    }
  </style>
</head>
<body>

<!-- ===== Layout ===== -->
<div class="maker-layout relative flex min-h-screen w-full max-w-[1500px] mx-auto items-center justify-center pr-[340px] max-md:flex-col max-md:px-4 max-md:py-6 max-md:gap-4 max-md:min-h-0 max-md:justify-start">

  <!-- ---- Center: Instagram Reel preview ---- -->
  <div id="capture-area" class="flex w-full justify-center max-md:w-auto">
    <div class="reel-card" id="reel-card">

      <div class="reel-bg" id="reel-bg"></div>
      <div class="reel-scrim-top"></div>
      <div class="reel-scrim-bottom"></div>

      <!-- Top bar -->
      <div class="reel-topbar">
        <span class="reel-heading">リール</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 4h-9A2.5 2.5 0 0 0 3 6.5v11A2.5 2.5 0 0 0 5.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-11A2.5 2.5 0 0 0 14.5 4z"/>
          <path d="M17 10l4-2.5v9L17 14"/>
        </svg>
      </div>

      <!-- Right action rail -->
      <div class="reel-rail">
        <div class="rail-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20.3S3.5 15.4 3.5 9.6a4.6 4.6 0 0 1 8.5-2.5A4.6 4.6 0 0 1 20.5 9.6c0 5.8-8.5 10.7-8.5 10.7z"/>
          </svg>
          <span class="rail-count" id="like-count">1.2万</span>
        </div>
        <div class="rail-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.38-4.1-1.05L3 20l1.1-5.2A8.5 8.5 0 1 1 21 11.5z"/>
          </svg>
          <span class="rail-count" id="comment-count">345</span>
        </div>
        <div class="rail-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 3L10 13.2"/>
            <path d="M21 3l-7 18-4-7.8L2 9.5 21 3z"/>
          </svg>
          <span class="rail-count" id="share-count">67</span>
        </div>
        <div class="rail-item">
          <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>
          </svg>
        </div>
        <div class="rail-audio" id="rail-audio"></div>
      </div>

      <!-- Bottom info -->
      <div class="reel-bottom">
        <div class="reel-user">
          <div class="reel-avatar" id="avatar-img"></div>
          <span class="reel-username" id="reel-username">username</span>
        </div>
        <div class="reel-caption" id="reel-caption">キャプションがここに入ります</div>
        <div class="reel-audio-row">
          <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
          <span class="reel-audio-name" id="reel-audio-name">username・オリジナル音源</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ---- Right panel (controls) ---- -->
  <div class="glass-panel side-panel input-section absolute inset-y-0 right-0 flex flex-col w-[320px] p-6 overflow-y-auto max-md:static max-md:w-full max-md:max-w-sm">
    <div class="mb-6 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-1.5 h-1.5 rounded-full bg-gradient-to-br from-[#833ab4] to-[#fd1d1d]"></div>
        <h2 class="panel-title text-sm font-semibold tracking-wide uppercase">Instagram Reel</h2>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="ライトモードに切り替える">
        <span aria-hidden="true">☀︎ / ☾</span><span data-theme-label>ダーク</span>
      </button>
    </div>

    <div class="flex flex-col gap-4">
      <div>
        <label class="field-label">Background Image</label>
        <input class="file-input" type="file" id="in-bg-image" accept="image/*">
        <p class="help-text text-[11px] mt-1.5">9:16 に収まるよう中央でトリミングされます</p>
      </div>
      <div>
        <label class="field-label">Icon Image</label>
        <input class="file-input" type="file" id="in-avatar-image" accept="image/*">
      </div>
      <div>
        <label class="field-label">Username</label>
        <input class="field-input" type="text" id="in-username" placeholder="ユーザー名">
      </div>
      <div>
        <label class="field-label">Caption</label>
        <textarea class="field-input" id="in-caption" rows="2" placeholder="キャプション"></textarea>
      </div>
      <div>
        <label class="field-label">Audio</label>
        <input class="field-input" type="text" id="in-audio" placeholder="例: ユーザー名・オリジナル音源">
      </div>
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="field-label">Likes</label>
          <input class="field-input" type="text" id="in-likes" placeholder="1.2万">
        </div>
        <div class="flex-1">
          <label class="field-label">Comments</label>
          <input class="field-input" type="text" id="in-comments" placeholder="345">
        </div>
        <div class="flex-1">
          <label class="field-label">Shares</label>
          <input class="field-input" type="text" id="in-shares" placeholder="67">
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="flex flex-col gap-2.5">
      <button class="btn-primary btn-apply" id="btn-update">適用してプレビュー</button>
      <button class="btn-primary btn-save" id="btn-capture">画像として保存</button>
    </div>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>

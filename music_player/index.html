<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>music player generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Apple SD Gothic Neo', 'Inter', 'sans-serif'],
          },
          colors: {
            surface: {
              0: '#0a0a0f',
              1: '#12121a',
              2: '#1a1a26',
              3: '#22222f',
            }
          },
          backdropBlur: {
            xs: '2px',
          },
        },
      },
    };
  </script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --glass-bg-hover: rgba(255,255,255,0.07);
      --accent: #7c6af0;
      --accent-soft: rgba(124,106,240,0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0a0a0f;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,106,240,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(56,189,248,0.08) 0%, transparent 60%);
      min-height: 100vh;
      font-family: 'Inter', 'Pretendard', sans-serif;
      color: #e2e2ea;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    /* ---- Glass panel ---- */
    .glass-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ---- Input fields ---- */
    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #e2e2ea;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field-input::placeholder { color: rgba(255,255,255,0.25); }
    .field-input:focus {
      border-color: rgba(124,106,240,0.6);
      background: rgba(124,106,240,0.06);
      box-shadow: 0 0 0 3px rgba(124,106,240,0.12);
    }

    /* ---- File input ---- */
    .file-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input::file-selector-button {
      background: rgba(124,106,240,0.2);
      border: 1px solid rgba(124,106,240,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #a89ff0;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.2s;
    }
    .file-input::file-selector-button:hover {
      background: rgba(124,106,240,0.35);
    }

    /* ---- Buttons ---- */
    .btn-primary {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-apply {
      background: linear-gradient(135deg, #7c6af0, #5b4fe0);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124,106,240,0.3);
    }
    .btn-apply:hover {
      background: linear-gradient(135deg, #8e7df5, #6b5fe8);
      box-shadow: 0 6px 20px rgba(124,106,240,0.4);
      transform: translateY(-1px);
    }
    .btn-save {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .btn-save:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ---- Color picker ---- */
    .color-picker-wrap {
      position: relative;
    }
    .color-picker-wrap input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      padding: 3px;
      cursor: pointer;
    }

    /* ---- Player card ---- */
    .player-card {
      background: var(--player-bg, #1a1825);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 20px;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.6),
        0 1px 0 rgba(255,255,255,0.08) inset;
      width: 300px;
      max-width: 100%;
      position: relative;
      overflow: hidden;
    }
    .player-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* ---- Progress / Volume slider ---- */
    .slider-wrap {
      position: relative;
      display: flex;
      align-items: center;
      height: 20px;
      width: 100%;
    }
    .slider-track {
      position: absolute;
      height: 3px;
      width: 100%;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
    }
    .slider-fill {
      position: absolute;
      height: 3px;
      border-radius: 4px;
      background: var(--player-point, #7c6af0);
      transition: width 0.1s linear;
    }
    .slider-thumb {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--player-point, #7c6af0);
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
      transform: translateX(-50%);
      pointer-events: none;
      transition: left 0.1s linear;
    }
    .slider-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    /* ---- Control buttons ---- */
    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      color: var(--player-point, #7c6af0);
      transition: opacity 0.15s, transform 0.15s;
    }
    .ctrl-btn:hover { opacity: 0.75; transform: scale(1.1); }
    .ctrl-btn-play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--player-point, #7c6af0);
      color: #fff !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .ctrl-btn-play:hover { opacity: 1 !important; transform: scale(1.06) !important; }

    /* ---- Label ---- */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    /* ---- Divider ---- */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 16px 0;
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .maker-layout { flex-direction: column; gap: 16px; padding: 16px; }
      .side-panel { position: static !important; width: 100% !important; max-width: 340px; border-radius: 16px; border: 1px solid var(--glass-border); }
    }
  </style>
</head>
<body>

<div id="youtube-audio" class="pointer-events-none fixed -left-0.5 -top-0.5 h-px w-px overflow-hidden"></div>

<!-- ===== Layout ===== -->
<div class="maker-layout relative flex min-h-screen w-full max-w-[1500px] mx-auto items-center justify-center pr-[340px] max-md:flex-col max-md:px-4 max-md:py-6 max-md:gap-4 max-md:min-h-0 max-md:justify-start">

  <!-- ---- Center: Player preview ---- -->
  <div id="capture-area" class="flex w-full justify-center max-md:w-auto">
    <div class="player-card" id="player-card"
         style="--player-bg:#1a1825; --player-point:#7c6af0; --player-text:#e2e2ea;">

      <!-- Cover art -->
      <div class="relative mb-3 aspect-square w-full overflow-hidden rounded-2xl" style="box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
        <div id="cover-img" class="absolute inset-0 h-full w-full bg-cover bg-center bg-no-repeat"
             style="background-image: url('https://via.placeholder.com/300/1a1825/5b4fe0?text=Cover+Art')"></div>
        <!-- Subtle overlay gradient at bottom -->
        <div class="absolute bottom-0 left-0 right-0 h-12"
             style="background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);"></div>
      </div>

      <!-- Copyright -->
      <div class="mb-3 text-right text-[10px] opacity-40" id="copyright-text"
           style="color: var(--player-text);">ⓒ 出典</div>

      <!-- Song info -->
      <div class="mb-4" style="color: var(--player-text);">
        <div class="text-base font-bold mb-0.5 leading-tight" id="song-title">曲のタイトル</div>
        <div class="text-[12px] opacity-50" id="song-artist">アーティスト名</div>
      </div>

      <!-- Progress slider -->
      <div class="slider-wrap mb-1" id="progress-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="progress-fill" style="width:0%"></div>
        <div class="slider-thumb" id="progress-thumb" style="left:0%"></div>
        <input class="slider-input" type="range" id="progress-slider" value="0" min="0" max="100">
      </div>
      <div class="flex justify-between text-[10px] opacity-30 mb-4" style="color: var(--player-text);">
        <span>0:00</span><span>—</span>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-7 mb-4">
        <button class="ctrl-btn w-6 h-6" type="button" aria-label="前へ">
          <i class="iconsax block !h-full !w-full fill-current [&_svg]:block [&_svg]:!h-full [&_svg]:!w-full" icon="previous"></i>
        </button>
        <button class="ctrl-btn ctrl-btn-play" type="button" id="btn-play" aria-label="再生と一時停止">
          <span class="flex h-5 w-5 ml-0.5" id="icon-play">
            <i class="iconsax block !h-full !w-full fill-current [&_svg]:block [&_svg]:!h-full [&_svg]:!w-full" icon="play"></i>
          </span>
          <span class="hidden h-5 w-5" id="icon-pause">
            <i class="iconsax block !h-full !w-full fill-current [&_svg]:block [&_svg]:!h-full [&_svg]:!w-full" icon="pause"></i>
          </span>
        </button>
        <button class="ctrl-btn w-6 h-6" type="button" aria-label="次へ">
          <i class="iconsax block !h-full !w-full fill-current [&_svg]:block [&_svg]:!h-full [&_svg]:!w-full" icon="next"></i>
        </button>
      </div>

      <!-- Volume -->
      <div class="flex items-center gap-2.5">
        <span class="ctrl-btn w-4 h-4 shrink-0">
          <i class="iconsax block !h-full !w-full fill-current [&_svg]:block [&_svg]:!h-full [&_svg]:!w-full" icon="volume-low"></i>
        </span>
        <div class="slider-wrap flex-1">
          <div class="slider-track"></div>
          <div class="slider-fill" id="volume-fill" style="width:50%"></div>
          <div class="slider-thumb" id="volume-thumb" style="left:50%"></div>
          <input class="slider-input" type="range" id="volume-slider" value="50" min="0" max="100">
        </div>
        <span class="ctrl-btn w-4 h-4 shrink-0">
          <i class="iconsax block !h-full !w-full fill-current [&_svg]:block [&_svg]:!h-full [&_svg]:!w-full" icon="volume-high"></i>
        </span>
      </div>

    </div>
  </div>

  <!-- ---- Right panel (controls) ---- -->
  <div class="glass-panel side-panel input-section absolute inset-y-0 right-0 flex flex-col w-[320px] p-6 overflow-y-auto max-md:static max-md:w-full max-md:max-w-sm">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <div class="w-1.5 h-1.5 rounded-full bg-[#7c6af0]"></div>
        <h2 class="text-sm font-semibold text-white/90 tracking-wide uppercase">Music Player</h2>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <div>
        <label class="field-label">Title</label>
        <input class="field-input" type="text" id="in-title" placeholder="タイトルまたはキャッチフレーズ">
      </div>
      <div>
        <label class="field-label">Artist</label>
        <input class="field-input" type="text" id="in-artist" placeholder="アーティスト名">
      </div>
      <div>
        <label class="field-label">Cover Image</label>
        <input class="file-input" type="file" id="in-image" accept="image/*">
      </div>
      <div>
        <label class="field-label">YouTube ID</label>
        <input class="field-input" type="text" id="in-youtube" placeholder="例: w2-uvGZCe3g">
        <p class="text-[11px] text-white/25 mt-1.5">URL の v= 以降の文字列</p>
      </div>
      <div>
        <label class="field-label">Copyright</label>
        <input class="field-input" type="text" id="in-copyright" placeholder="ⓒ 依頼主">
      </div>
    </div>

    <hr class="divider">

    <!-- Color pickers -->
    <div class="flex gap-3">
      <div class="flex-1">
        <label class="field-label">BG</label>
        <div class="color-picker-wrap">
          <input type="color" id="in-bg-color" value="#1a1825">
        </div>
      </div>
      <div class="flex-1">
        <label class="field-label">Accent</label>
        <div class="color-picker-wrap">
          <input type="color" id="in-point-color" value="#7c6af0">
        </div>
      </div>
      <div class="flex-1">
        <label class="field-label">Text</label>
        <div class="color-picker-wrap">
          <input type="color" id="in-text-color" value="#e2e2ea">
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="flex flex-col gap-2.5">
      <button class="btn-primary btn-apply" id="btn-update">適用してプレビュー</button>
      <button class="btn-primary btn-save" id="btn-capture">画像として保存</button>
    </div>
  </div>

</div>

<script src="https://grxvityhj.github.io/iconsax/script.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>

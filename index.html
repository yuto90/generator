<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>music player generators</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('generator-theme') === 'light' ? 'light' : 'dark';
    } catch {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #0a0a0f;
      --panel-bg: rgba(255,255,255,0.03);
      --mobile-panel-bg: #12121a;
      --text-main: #e2e2ea;
      --text-strong: rgba(255,255,255,0.9);
      --text-name: rgba(255,255,255,0.88);
      --text-muted: rgba(255,255,255,0.33);
      --text-subtle: rgba(255,255,255,0.2);
      --border: rgba(255,255,255,0.08);
      --border-active: rgba(255,255,255,0.12);
      --hover: rgba(255,255,255,0.05);
      --active: rgba(255,255,255,0.07);
      --frame-bg: #0a0a0f;
      --icon-shadow: rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page-bg: #f5f5fa;
      --panel-bg: rgba(255,255,255,0.82);
      --mobile-panel-bg: #ffffff;
      --text-main: #24242d;
      --text-strong: #17171d;
      --text-name: #24242d;
      --text-muted: rgba(36,36,45,0.58);
      --text-subtle: rgba(36,36,45,0.42);
      --border: rgba(25,25,35,0.12);
      --border-active: rgba(40,35,80,0.2);
      --hover: rgba(40,35,80,0.06);
      --active: rgba(40,35,80,0.1);
      --frame-bg: #f5f5fa;
      --icon-shadow: rgba(30,25,50,0.18);
    }

    * { box-sizing: border-box; }

    .mobile-header,
    .drawer-backdrop { display: none; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      color: var(--text-main);
      display: flex;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 14px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      margin-bottom: 6px;
    }
    .sidebar-header .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c6af0, #fa2d48);
    }
    .sidebar-header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-strong);
      margin: 0;
    }
    .sidebar-sub {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 10px;
      margin: 0 0 20px;
    }

    .gen-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .gen-item:hover { background: var(--hover); }
    .gen-item.active {
      background: var(--active);
      border-color: var(--border-active);
    }

    .gen-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--icon-shadow);
    }
    .gen-icon svg { width: 18px; height: 18px; fill: #fff; }

    .gen-info { min-width: 0; }
    .gen-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-name);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gen-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 0 10px;
      font-size: 10px;
      color: var(--text-subtle);
    }
    .sidebar-footer-label { display: block; margin-bottom: 10px; }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--hover);
      color: var(--text-main);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .theme-toggle:hover { background: var(--active); }
    .theme-icon { font-size: 14px; letter-spacing: 0.08em; }
    .theme-toggle:focus-visible {
      outline: 2px solid #7c6af0;
      outline-offset: 2px;
    }
    .menu-toggle:focus-visible,
    .gen-item:focus-visible {
      outline: 2px solid #7c6af0;
      outline-offset: 2px;
    }

    /* ---- Main ---- */
    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
    }
    .main iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--frame-bg);
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      .mobile-header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 8px;
        min-height: 56px;
        padding: 6px 10px;
        padding-top: max(6px, env(safe-area-inset-top));
        background: color-mix(in srgb, var(--mobile-panel-bg) 92%, transparent);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      .menu-toggle {
        display: grid;
        align-content: center;
        justify-content: center;
        gap: 5px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--hover);
        color: var(--text-main);
        cursor: pointer;
      }
      .menu-toggle span {
        display: block;
        width: 18px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
      }
      #mobile-generator-name {
        overflow: hidden;
        color: var(--text-strong);
        font-size: 14px;
        font-weight: 650;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mobile-theme-toggle {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        min-height: 44px;
        padding: 0;
      }
      .mobile-theme-toggle .theme-icon { font-size: 13px; }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 40;
        width: min(84vw, 320px);
        height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 14px 24px;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--mobile-panel-bg);
        border-right: 1px solid var(--border);
        box-shadow: 18px 0 48px rgba(0, 0, 0, 0.32);
        transform: translateX(-105%);
        transition: transform 180ms ease;
      }
      .drawer-open .sidebar { transform: translateX(0); }
      .sidebar-header { margin-top: 4px; }
      .sidebar-sub { margin-bottom: 16px; }
      .sidebar-footer { display: none; }
      .gen-item {
        width: 100%;
        min-height: 56px;
        margin-bottom: 6px;
      }
      .gen-desc { display: block; }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 35;
        display: block;
        background: rgba(0, 0, 0, 0.52);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .drawer-open .drawer-backdrop {
        opacity: 1;
        pointer-events: auto;
      }
      :root.drawer-open,
      :root.drawer-open body { overflow: hidden; }

      /* iframe はモバイルで中身の高さに合わせる(JS が設定)ため auto */
      .main { height: auto; }
    }

    @media (max-width: 768px) and (prefers-reduced-motion: reduce) {
      .sidebar,
      .drawer-backdrop { transition: none; }
    }
  </style>
</head>
<body>

  <header class="mobile-header">
    <button type="button" class="menu-toggle" aria-controls="generator-drawer" aria-expanded="false" aria-label="ジェネレーター一覧を開く">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <div id="mobile-generator-name" aria-live="polite">Music Player</div>
    <button type="button" class="theme-toggle mobile-theme-toggle" data-theme-toggle aria-pressed="false" aria-label="ライトモードに切り替える">
      <span class="theme-icon" aria-hidden="true">☀︎ / ☾</span>
      <span class="visually-hidden" data-theme-label>ダーク</span>
    </button>
  </header>

  <!-- ---- Left sidebar: generator list ---- -->
  <aside id="generator-drawer" class="sidebar" aria-label="ジェネレーター一覧">
    <div class="sidebar-header">
      <div class="dot"></div>
      <h1>Generators</h1>
    </div>
    <p class="sidebar-sub">作りたいプレーヤーを選択</p>
    <nav id="gen-list" aria-label="ジェネレーターを選択"></nav>
    <div class="sidebar-footer">
      <span class="sidebar-footer-label">music player generators</span>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="ライトモードに切り替える">
        <span class="theme-icon" aria-hidden="true">☀︎ / ☾</span>
        <span data-theme-label>ダーク</span>
      </button>
    </div>
  </aside>

  <div class="drawer-backdrop" aria-hidden="true"></div>

  <!-- ---- Main: selected generator ---- -->
  <main class="main">
    <iframe id="gen-frame" title="generator preview"></iframe>
  </main>

  <script type="module">
    import { readTheme, writeTheme, applyTheme, isThemeMessage, postTheme } from './theme.js';
    import { applyDrawerState } from './drawer.js';

    const GENERATORS = [
      {
        id: 'music_player',
        name: 'Music Player',
        desc: '汎用グラスデザイン',
        path: 'music_player/',
        color: 'linear-gradient(135deg, #7c6af0, #5b4fe0)',
        icon: '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      },
      {
        id: 'apple_music_player',
        name: 'Apple Music',
        desc: 'Now Playing 風カード',
        path: 'apple_music_player/',
        color: 'linear-gradient(135deg, #fa2d48, #b91d33)',
        icon: '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      },
      {
        id: 'youtube_music_player',
        name: 'YouTube Music',
        desc: 'ダークテーマ再生画面',
        path: 'youtube_music_player/',
        color: 'linear-gradient(135deg, #ff1a1a, #990000)',
        icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 8.6v6.8c0 .5.55.8.97.53l5.2-3.4a.62.62 0 0 0 0-1.06l-5.2-3.4a.62.62 0 0 0-.97.53z"/></svg>',
      },
      {
        id: 'instagram_reel',
        name: 'Instagram Reel',
        desc: 'リール風 9:16 画像',
        path: 'instagram_reel/',
        color: 'linear-gradient(135deg, #833ab4, #fd1d1d 60%, #fcb045)',
        icon: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 9.2v5.6c0 .5.55.8.97.53l4.3-2.8a.62.62 0 0 0 0-1.06l-4.3-2.8a.62.62 0 0 0-.97.53z"/></svg>',
      },
    ];

    const listEl = document.getElementById('gen-list');
    const frameEl = document.getElementById('gen-frame');
    const rootEl = document.documentElement;
    const themeToggles = [...document.querySelectorAll('[data-theme-toggle]')];
    const menuToggle = document.querySelector('.menu-toggle');
    const drawer = document.getElementById('generator-drawer');
    const backdrop = document.querySelector('.drawer-backdrop');
    const mobileGeneratorName = document.getElementById('mobile-generator-name');
    const mobileQuery = window.matchMedia('(max-width: 768px)');
    const drawerElements = { root: rootEl, toggle: menuToggle, drawer, backdrop };
    let drawerOpen = false;
    let currentTheme = readTheme();

    function renderTheme(theme) {
      currentTheme = theme;
      themeToggles.forEach(toggle => applyTheme(rootEl, toggle, currentTheme));
    }

    renderTheme(currentTheme);

    function setTheme(theme, persist = true, notifyFrame = true) {
      renderTheme(theme);
      if (persist) writeTheme(window.localStorage, currentTheme);
      if (notifyFrame && frameEl.contentWindow) {
        postTheme(frameEl.contentWindow, location.origin, currentTheme);
      }
    }

    themeToggles.forEach(toggle => {
      toggle.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });
    });

    function syncDrawerForViewport(open = drawerOpen) {
      drawerOpen = applyDrawerState(drawerElements, open, mobileQuery.matches);
    }

    function openDrawer() {
      syncDrawerForViewport(true);
      requestAnimationFrame(() => {
        drawer.querySelector('.gen-item.active, .gen-item')?.focus();
      });
    }

    function closeDrawer(returnFocus = true) {
      const wasOpen = drawerOpen;
      syncDrawerForViewport(false);
      if (returnFocus && wasOpen && mobileQuery.matches) menuToggle.focus();
    }

    menuToggle.addEventListener('click', () => {
      if (drawerOpen) closeDrawer();
      else openDrawer();
    });
    backdrop.addEventListener('click', () => closeDrawer());
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && drawerOpen) closeDrawer();
    });
    mobileQuery.addEventListener('change', () => {
      closeDrawer(false);
      syncFrameHeight();
    });

    function select(id, updateHash = true) {
      const gen = GENERATORS.find(g => g.id === id) || GENERATORS[0];
      frameEl.src = gen.path;
      mobileGeneratorName.textContent = gen.name;
      if (updateHash) history.replaceState(null, '', '#' + gen.id);
      document.querySelectorAll('.gen-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === gen.id);
      });
      closeDrawer();
    }

    GENERATORS.forEach(gen => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gen-item';
      btn.dataset.id = gen.id;
      btn.innerHTML = `
        <div class="gen-icon" style="background: ${gen.color}">${gen.icon}</div>
        <div class="gen-info">
          <div class="gen-name">${gen.name}</div>
          <div class="gen-desc">${gen.desc}</div>
        </div>
      `;
      btn.addEventListener('click', () => select(gen.id));
      listEl.appendChild(btn);
    });

    // ----- モバイル: iframe の高さを中身に合わせ、二重スクロールを防ぐ -----
    // (全ページが同一オリジンなので contentWindow を参照できる)
    let frameObserver = null;
    function syncFrameHeight() {
      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (!isMobile) { frameEl.style.height = ''; return; }
      try {
        const doc = frameEl.contentWindow.document;
        frameEl.style.height = doc.documentElement.scrollHeight + 'px';
      } catch (e) { /* クロスオリジン等では無視 */ }
    }
    frameEl.addEventListener('load', () => {
      syncFrameHeight();
      postTheme(frameEl.contentWindow, location.origin, currentTheme);
      try {
        if (frameObserver) frameObserver.disconnect();
        frameObserver = new ResizeObserver(syncFrameHeight);
        frameObserver.observe(frameEl.contentWindow.document.body);
      } catch (e) { /* ResizeObserver 非対応時は無視 */ }
    });
    window.addEventListener('resize', syncFrameHeight);
    window.addEventListener('message', (event) => {
      if (isThemeMessage(event, location.origin)) {
        setTheme(event.data.theme, true, false);
      }
    });

    // URL ハッシュで初期選択を復元(リロード・共有対応)
    select(location.hash.slice(1) || GENERATORS[0].id, false);
    syncDrawerForViewport();

    // ブラウザの戻る/進むやハッシュ直接変更にも追従
    window.addEventListener('hashchange', () => {
      select(location.hash.slice(1) || GENERATORS[0].id, false);
    });
  </script>
</body>
</html>

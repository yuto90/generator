<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify style player generator</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('generator-theme') === 'light' ? 'light' : 'dark';
    } catch {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #090d0b;
      --page-glow: rgba(29, 185, 84, 0.12);
      --panel-bg: rgba(19, 24, 21, 0.94);
      --panel-border: rgba(255, 255, 255, 0.08);
      --field-bg: rgba(255, 255, 255, 0.05);
      --field-border: rgba(255, 255, 255, 0.1);
      --text-main: #f2f5f3;
      --text-muted: rgba(242, 245, 243, 0.55);
      --card-bg-top: #1d2420;
      --card-bg-bottom: #101310;
      --card-text: #ffffff;
      --card-muted: rgba(255, 255, 255, 0.62);
      --card-track: rgba(255, 255, 255, 0.25);
      --card-shadow: rgba(0, 0, 0, 0.52);
      --accent: #1DB954;
      --accent-hover: #1ed760;
      --danger: #ff7b7b;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --page-bg: #f2f6f3;
      --page-glow: rgba(29, 185, 84, 0.16);
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(19, 35, 25, 0.12);
      --field-bg: rgba(255, 255, 255, 0.88);
      --field-border: rgba(19, 35, 25, 0.16);
      --text-main: #172019;
      --text-muted: rgba(23, 32, 25, 0.58);
      --card-bg-top: #ffffff;
      --card-bg-bottom: #e9eee9;
      --card-text: #191414;
      --card-muted: rgba(25, 20, 20, 0.6);
      --card-track: rgba(25, 20, 20, 0.22);
      --card-shadow: rgba(33, 55, 40, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% 2%, var(--page-glow), transparent 38%),
        var(--page-bg);
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .preview-stage {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px;
    }

    .spotify-card {
      width: 340px;
      max-width: 100%;
      padding: 20px 22px 22px;
      color: var(--card-text);
      background: linear-gradient(165deg, var(--card-bg-top), var(--card-bg-bottom) 72%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      box-shadow: 0 30px 75px var(--card-shadow);
      overflow: hidden;
    }

    :root[data-theme="light"] .spotify-card {
      border-color: rgba(25, 20, 20, 0.08);
    }

    .card-topbar,
    .track-row,
    .transport,
    .volume-row,
    .device-row {
      display: flex;
      align-items: center;
    }

    .card-topbar {
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .playing-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.68;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .icon-button:hover { background: rgba(255, 255, 255, 0.08); }
    :root[data-theme="light"] .icon-button:hover { background: rgba(25, 20, 20, 0.07); }
    .icon-button:focus-visible,
    .theme-toggle:focus-visible,
    .primary-button:focus-visible,
    .secondary-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .icon-button svg { width: 20px; height: 20px; fill: currentColor; }

    .artwork {
      width: 100%;
      aspect-ratio: 1;
      margin-bottom: 20px;
      border-radius: 10px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
    }

    .track-row { gap: 12px; margin-bottom: 16px; }
    .track-copy { flex: 1; min-width: 0; }
    .track-title {
      overflow: hidden;
      font-size: 20px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-artist {
      overflow: hidden;
      margin-top: 3px;
      color: var(--card-muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .heart-button { color: var(--accent); }

    .range-shell {
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
    }
    .range-track,
    .range-fill {
      position: absolute;
      right: 0;
      left: 0;
      height: 4px;
      border-radius: 999px;
    }
    .range-track { background: var(--card-track); }
    .range-fill {
      right: auto;
      width: 0;
      background: var(--accent);
      pointer-events: none;
    }
    .range-input {
      position: absolute;
      z-index: 2;
      width: 100%;
      height: 18px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      color: var(--card-muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .transport {
      justify-content: space-between;
      margin: 14px 2px 12px;
    }
    .transport .minor { width: 28px; height: 28px; color: var(--card-muted); }
    .transport .skip { width: 38px; height: 38px; }
    .transport .skip svg { width: 27px; height: 27px; }
    .transport .active { color: var(--accent); }
    .play-button {
      width: 54px;
      height: 54px;
      color: var(--card-bg-bottom);
      background: var(--card-text);
      transition: transform 0.15s ease;
    }
    .play-button:hover { background: var(--card-text); transform: scale(1.04); }
    .play-button svg { width: 25px; height: 25px; }
    .pause-icon { display: none; }

    .volume-row { gap: 9px; margin-top: 5px; }
    .volume-row > svg { width: 16px; height: 16px; fill: currentColor; color: var(--card-muted); }
    .volume-row .range-shell { flex: 1; }
    .volume-row .range-track,
    .volume-row .range-fill { height: 3px; }

    .device-row {
      justify-content: space-between;
      margin-top: 17px;
      color: var(--card-muted);
      font-size: 10px;
    }
    .device-copy { display: flex; align-items: center; gap: 6px; }
    .device-copy svg, .queue-icon { width: 16px; height: 16px; fill: currentColor; }
    .device-copy span { color: var(--accent); font-weight: 650; }

    .editor {
      min-height: 100vh;
      padding: 24px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .editor-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .editor-title-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px rgba(29, 185, 84, 0.6); }
    .editor h1 { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }

    .theme-toggle {
      min-height: 36px;
      padding: 7px 9px;
      color: var(--text-main);
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 9px;
      font-size: 10px;
      cursor: pointer;
    }

    .form { display: grid; gap: 15px; margin-top: 24px; }
    .field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .field-input,
    .file-input {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      color: var(--text-main);
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 9px;
      outline: none;
    }
    .field-input:focus,
    .file-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.12); }
    .field-input[aria-invalid="true"] { border-color: var(--danger); }
    .file-input { padding: 7px; color: var(--text-muted); font-size: 11px; }
    .file-input::file-selector-button {
      margin-right: 8px;
      padding: 5px 8px;
      color: var(--text-main);
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid rgba(29, 185, 84, 0.28);
      border-radius: 6px;
      cursor: pointer;
    }
    .time-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-help, .field-error, .playback-status { margin: 5px 0 0; font-size: 10px; line-height: 1.45; }
    .field-help, .playback-status { color: var(--text-muted); }
    .field-error { min-height: 15px; color: var(--danger); }
    .playback-status[data-tone="error"] { color: var(--danger); }
    .playback-status[data-tone="success"] { color: var(--accent); }

    .youtube-player-panel[hidden] { display: none; }
    .youtube-player-panel {
      width: 100%;
      padding: 8px;
      background: #000;
      border: 1px solid var(--field-border);
      border-radius: 10px;
      overflow: hidden;
    }
    #youtube-audio,
    #youtube-audio iframe {
      display: block;
      width: 272px;
      height: 200px;
      max-width: 100%;
      margin: 0 auto;
      border: 0;
      background: #000;
    }

    .actions { display: grid; gap: 9px; margin-top: 4px; }
    .primary-button,
    .secondary-button {
      min-height: 42px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }
    .primary-button { color: #07150c; background: var(--accent); border: 0; }
    .primary-button:hover { background: var(--accent-hover); }
    .secondary-button { color: var(--text-main); background: transparent; border: 1px solid var(--field-border); }
    .secondary-button:hover { background: var(--field-bg); }
    .primary-button:disabled,
    .secondary-button:disabled { opacity: 0.55; cursor: wait; }

    @media (max-width: 768px) {
      .app-shell { grid-template-columns: 1fr; }
      .preview-stage { min-height: auto; padding: 28px 16px; }
      .editor { min-height: auto; padding: 22px 18px 32px; border-top: 1px solid var(--panel-border); border-left: 0; }
      .spotify-card { width: min(340px, calc(100vw - 32px)); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="preview-stage" aria-label="プレーヤープレビュー">
      <article class="spotify-card" id="player-card">
        <div class="card-topbar">
          <button class="icon-button" type="button" aria-label="閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.3 8.7a1 1 0 0 1 1.4 0l5.3 5.3 5.3-5.3a1 1 0 1 1 1.4 1.4l-6 6a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.4z"/></svg>
          </button>
          <span class="playing-label">Now playing</span>
          <button class="icon-button" type="button" aria-label="その他">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>

        <div class="artwork" id="cover-img" role="img" aria-label="アートワーク"></div>

        <div class="track-row">
          <div class="track-copy">
            <div class="track-title" id="song-title">曲のタイトル</div>
            <div class="track-artist" id="song-artist">アーティスト名</div>
          </div>
          <button class="icon-button heart-button" type="button" aria-label="お気に入り">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a1 1 0 0 1-.55-.17C5.8 17.05 3 14.02 3 10.1A5.1 5.1 0 0 1 12 6.8a5.1 5.1 0 0 1 9 3.3c0 3.92-2.8 6.95-8.45 10.73A1 1 0 0 1 12 21z"/></svg>
          </button>
        </div>

        <div class="range-shell">
          <div class="range-track"></div>
          <div class="range-fill" id="progress-fill"></div>
          <input class="range-input" id="progress-slider" type="range" min="0" max="100" value="0" aria-label="再生位置">
        </div>
        <div class="time-row"><span id="time-current">0:00</span><span id="time-total">3:30</span></div>

        <div class="transport">
          <button class="icon-button minor active" type="button" aria-label="シャッフル">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4V8h-1.4a4 4 0 0 0-3.2 1.6l-1.15 1.53-1.5-2 1.05-1.4A6.5 6.5 0 0 1 15.6 5H17V3zM3 5h3.4a6.5 6.5 0 0 1 5.2 2.6l4 5.33A4 4 0 0 0 18.8 14H21v-3l4 4-4 4v-3h-2.2a6.5 6.5 0 0 1-5.2-2.6l-4-5.33A4 4 0 0 0 6.4 7H3V5zm5.75 8.87 1.5 2-.85 1.13A6.5 6.5 0 0 1 4.2 19H3v-2h1.2a4 4 0 0 0 3.2-1.6l1.35-1.53z"/></svg>
          </button>
          <button class="icon-button skip" type="button" aria-label="前の曲">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6V5zm12.2.9v12.2a.8.8 0 0 1-1.23.68l-9.2-6.1a.81.81 0 0 1 0-1.36l9.2-6.1a.8.8 0 0 1 1.23.68z"/></svg>
          </button>
          <button class="icon-button play-button" id="btn-play" type="button" aria-label="再生">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8v12.4c0 .65.72 1.04 1.26.68l9.3-6.2a.82.82 0 0 0 0-1.36l-9.3-6.2A.82.82 0 0 0 8 5.8z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.5" height="15" rx="1"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1"/></svg>
          </button>
          <button class="icon-button skip" type="button" aria-label="次の曲">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2V5zM5.8 5.9v12.2a.8.8 0 0 0 1.23.68l9.2-6.1a.81.81 0 0 0 0-1.36l-9.2-6.1a.8.8 0 0 0-1.23.68z"/></svg>
          </button>
          <button class="icon-button minor active" type="button" aria-label="リピート">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4V8H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5h10V3zm-10 18-4-4 4-4v3h10a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5H7v3z"/></svg>
          </button>
        </div>

        <div class="volume-row">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5v14a1 1 0 0 1-1.65.76L7 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h3l4.35-3.76A1 1 0 0 1 13 5zm3.3 3.3a1 1 0 0 1 1.4 0 5.23 5.23 0 0 1 0 7.4 1 1 0 0 1-1.4-1.4 3.24 3.24 0 0 0 0-4.6 1 1 0 0 1 0-1.4z"/></svg>
          <div class="range-shell">
            <div class="range-track"></div>
            <div class="range-fill" id="volume-fill" style="width:50%"></div>
            <input class="range-input" id="volume-slider" type="range" min="0" max="100" value="50" aria-label="音量">
          </div>
        </div>

        <div class="device-row">
          <div class="device-copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6l2 3h-2.3l-2-3H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v10h16V5H4z"/></svg>
            <span>This device</span>
          </div>
          <svg class="queue-icon" viewBox="0 0 24 24" aria-label="キュー"><path d="M4 5h16v2H4V5zm0 6h10v2H4v-2zm0 6h10v2H4v-2zm13-5 5 3-5 3v-6z"/></svg>
        </div>
      </article>
    </section>

    <aside class="editor" aria-label="編集パネル">
      <div class="editor-header">
        <div class="editor-title-wrap"><span class="brand-dot"></span><h1>Spotify style</h1></div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="ライトモードに切り替える">
          ☀︎ / ☾ <span data-theme-label>ダーク</span>
        </button>
      </div>

      <form class="form" id="player-form" novalidate>
        <div>
          <label class="field-label" for="in-title">Title</label>
          <input class="field-input" id="in-title" type="text" placeholder="曲のタイトル">
        </div>
        <div>
          <label class="field-label" for="in-artist">Artist</label>
          <input class="field-input" id="in-artist" type="text" placeholder="アーティスト名">
        </div>
        <div>
          <label class="field-label" for="in-image">Artwork</label>
          <input class="file-input" id="in-image" type="file" accept="image/*">
          <p class="field-error" id="error-image" aria-live="polite"></p>
        </div>
        <div class="time-fields">
          <div>
            <label class="field-label" for="in-current-time">Position</label>
            <input class="field-input" id="in-current-time" type="text" inputmode="numeric" value="0:00" aria-describedby="error-current-time">
            <p class="field-error" id="error-current-time" aria-live="polite"></p>
          </div>
          <div>
            <label class="field-label" for="in-duration">Duration</label>
            <input class="field-input" id="in-duration" type="text" inputmode="numeric" value="3:30" aria-describedby="error-duration">
            <p class="field-error" id="error-duration" aria-live="polite"></p>
          </div>
        </div>
        <div>
          <label class="field-label" for="in-youtube">YouTube URL</label>
          <input class="field-input" id="in-youtube" type="text" placeholder="URL または動画ID" aria-describedby="youtube-help error-youtube">
          <p class="field-help" id="youtube-help">未入力でも静的画像を生成できます</p>
          <p class="field-error" id="error-youtube" aria-live="polite"></p>
        </div>
        <div class="youtube-player-panel" id="youtube-player-panel" hidden>
          <div id="youtube-audio" aria-label="YouTube プレーヤー"></div>
        </div>
        <p class="playback-status" id="playback-status" aria-live="polite">静的プレビューモード</p>
        <div class="actions">
          <button class="primary-button" id="btn-update" type="submit">適用してプレビュー</button>
          <button class="secondary-button" id="btn-capture" type="button">画像として保存</button>
        </div>
      </form>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

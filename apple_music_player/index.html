<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>apple music generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --accent: #fa2d48;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0d0a0b;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(250,45,72,0.13) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(255,120,90,0.08) 0%, transparent 60%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      color: #e9e4e5;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    /* ---- Glass panel ---- */
    .glass-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ---- Input fields ---- */
    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #e9e4e5;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field-input::placeholder { color: rgba(255,255,255,0.25); }
    .field-input:focus {
      border-color: rgba(250,45,72,0.6);
      background: rgba(250,45,72,0.06);
      box-shadow: 0 0 0 3px rgba(250,45,72,0.12);
    }

    /* ---- File input ---- */
    .file-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input::file-selector-button {
      background: rgba(250,45,72,0.2);
      border: 1px solid rgba(250,45,72,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #ff8a9a;
      cursor: pointer;
      margin-right: 10px;
      transition: background 0.2s;
    }
    .file-input::file-selector-button:hover {
      background: rgba(250,45,72,0.35);
    }

    /* ---- Buttons ---- */
    .btn-primary {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-apply {
      background: linear-gradient(135deg, #fa2d48, #d61e37);
      color: #fff;
      box-shadow: 0 4px 16px rgba(250,45,72,0.3);
    }
    .btn-apply:hover {
      background: linear-gradient(135deg, #ff4a62, #e62a44);
      box-shadow: 0 6px 20px rgba(250,45,72,0.4);
      transform: translateY(-1px);
    }
    .btn-save {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .btn-save:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ---- Color picker ---- */
    .color-picker-wrap input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      padding: 3px;
      cursor: pointer;
    }

    /* ---- Label ---- */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    /* ---- Divider ---- */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 16px 0;
    }

    /* =====================================================
       Apple Music player card
       ===================================================== */
    .am-card {
      width: 340px;
      border-radius: 34px;
      padding: 14px 26px 26px;
      position: relative;
      overflow: hidden;
      color: var(--player-text, #ffffff);
      box-shadow:
        0 24px 64px rgba(0,0,0,0.6),
        0 1px 0 rgba(255,255,255,0.08) inset;
    }

    /* grabber */
    .am-grabber {
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: currentColor;
      opacity: 0.3;
      margin: 0 auto 22px;
    }

    /* artwork: 再生中は拡大、停止中は縮小(Apple Music の挙動) */
    .am-artwork-wrap {
      aspect-ratio: 1 / 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }
    .am-artwork {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55);
      transform: scale(0.8);
      transition: transform 0.45s cubic-bezier(0.32, 1.4, 0.5, 1), box-shadow 0.45s;
    }
    .am-artwork.playing {
      transform: scale(1);
      box-shadow: 0 16px 56px rgba(0,0,0,0.65);
    }

    /* song info row */
    .am-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .am-artist {
      font-size: 16px;
      font-weight: 400;
      opacity: 0.55;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .am-more-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: color-mix(in srgb, currentColor 14%, transparent);
      background: rgba(255,255,255,0.14);
      color: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 6px;
    }

    /* ---- Progress / Volume slider ---- */
    .slider-wrap {
      position: relative;
      display: flex;
      align-items: center;
      height: 20px;
      width: 100%;
    }
    .slider-track {
      position: absolute;
      height: 6px;
      width: 100%;
      border-radius: 3px;
      background: currentColor;
      opacity: 0.18;
    }
    .slider-fill {
      position: absolute;
      height: 6px;
      border-radius: 3px;
      background: var(--player-point, #ffffff);
      opacity: 0.75;
      transition: width 0.1s linear;
    }
    .slider-wrap.thin .slider-track,
    .slider-wrap.thin .slider-fill { height: 4px; border-radius: 2px; }
    .slider-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    .am-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
      opacity: 0.4;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Control buttons ---- */
    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      color: inherit;
      transition: opacity 0.15s, transform 0.15s;
    }
    .ctrl-btn:hover { opacity: 0.7; transform: scale(1.08); }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn svg { width: 100%; height: 100%; fill: currentColor; }

    .am-bottom-icons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      opacity: 0.55;
      margin-top: 22px;
    }
    .am-bottom-icons .ctrl-btn { width: 20px; height: 20px; }

    .am-copyright {
      text-align: center;
      font-size: 9px;
      opacity: 0.35;
      margin-top: 16px;
      letter-spacing: 0.03em;
    }

    /* ---- Playlist ---- */
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .playlist-item:hover { background: rgba(255,255,255,0.05); }
    .playlist-item.active {
      background: rgba(250,45,72,0.1);
      border-color: rgba(250,45,72,0.25);
    }
    .playlist-cover {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      flex-shrink: 0;
      background: rgba(250,45,72,0.15);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .playlist-info { flex: 1; min-width: 0; }
    .playlist-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .playlist-artist {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .playlist-delete {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.2);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .playlist-item:hover .playlist-delete { opacity: 1; }
    .playlist-delete:hover { background: rgba(255,80,80,0.15); color: #ff7070; }
    .playlist-delete:disabled { opacity: 0 !important; pointer-events: none; }
    .btn-add-song {
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(250,45,72,0.3);
      background: rgba(250,45,72,0.1);
      color: #ff8a9a;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      letter-spacing: 0.02em;
    }
    .btn-add-song:hover {
      background: rgba(250,45,72,0.2);
      border-color: rgba(250,45,72,0.5);
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .maker-layout { flex-direction: column; gap: 16px; padding: 16px; }
      .side-panel { position: static !important; width: 100% !important; max-width: 340px; border-radius: 16px; border: 1px solid var(--glass-border); }
    }
  </style>
</head>
<body>

<div id="youtube-audio" class="pointer-events-none fixed -left-0.5 -top-0.5 h-px w-px overflow-hidden"></div>

<!-- ===== Layout ===== -->
<div class="maker-layout relative flex min-h-screen w-full max-w-[1500px] mx-auto items-center justify-center px-[340px] max-md:flex-col max-md:px-4 max-md:py-6 max-md:gap-4">

  <!-- ---- Left panel (playlist) ---- -->
  <aside class="glass-panel side-panel absolute inset-y-0 left-0 flex flex-col w-[320px] p-6 overflow-y-auto max-md:static max-md:w-full max-md:max-w-sm">
    <div class="mb-4">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2">
          <div class="w-1.5 h-1.5 rounded-full bg-[#fa2d48]"></div>
          <h2 class="text-sm font-semibold text-white/90 tracking-wide uppercase">Playlist</h2>
        </div>
        <button class="btn-add-song" id="btn-add-song" type="button">＋ 追加</button>
      </div>
      <p class="text-xs text-white/30 mt-1">曲を選んで右パネルで編集</p>
    </div>
    <div id="playlist-list" class="flex flex-col gap-1.5"></div>
  </aside>

  <!-- ---- Center: Apple Music player preview ---- -->
  <div id="capture-area" class="flex w-full justify-center max-md:w-auto">
    <div class="am-card" id="player-card">

      <div class="am-grabber"></div>

      <!-- Cover art -->
      <div class="am-artwork-wrap">
        <div id="cover-img" class="am-artwork"></div>
      </div>

      <!-- Song info -->
      <div class="flex items-center gap-3 mb-3">
        <div class="flex-1 min-w-0">
          <div class="am-title" id="song-title">曲のタイトル</div>
          <div class="am-artist" id="song-artist">アーティスト名</div>
        </div>
        <button class="am-more-btn" type="button" aria-label="その他">…</button>
      </div>

      <!-- Progress slider -->
      <div class="slider-wrap" id="progress-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="progress-fill" style="width:0%"></div>
        <input class="slider-input" type="range" id="progress-slider" value="0" min="0" max="100">
      </div>
      <div class="am-times">
        <span id="time-current">0:00</span><span id="time-remaining">-:--</span>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-12 mt-4 mb-4">
        <button class="ctrl-btn w-8 h-8" type="button" aria-label="前へ">
          <svg viewBox="0 0 24 24"><path d="M11.6 6.1v11.8c0 .55-.62.86-1.06.53L2.6 12.53a.66.66 0 0 1 0-1.06l7.94-5.9c.44-.33 1.06-.02 1.06.53z"/><path d="M21.6 6.1v11.8c0 .55-.62.86-1.06.53l-7.94-5.9a.66.66 0 0 1 0-1.06l7.94-5.9c.44-.33 1.06-.02 1.06.53z"/></svg>
        </button>
        <button class="ctrl-btn w-11 h-11" type="button" id="btn-play" aria-label="再生と一時停止">
          <span class="block h-full w-full" id="icon-play">
            <svg viewBox="0 0 24 24"><path d="M7.5 5.6v12.8c0 .62.68.99 1.2.66l10.1-6.4a.78.78 0 0 0 0-1.32L8.7 4.94a.78.78 0 0 0-1.2.66z"/></svg>
          </span>
          <span class="hidden h-full w-full" id="icon-pause">
            <svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.3"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.3"/></svg>
          </span>
        </button>
        <button class="ctrl-btn w-8 h-8" type="button" aria-label="次へ">
          <svg viewBox="0 0 24 24"><path d="M2.4 6.1v11.8c0 .55.62.86 1.06.53l7.94-5.9a.66.66 0 0 0 0-1.06L3.46 5.57c-.44-.33-1.06-.02-1.06.53z"/><path d="M12.4 6.1v11.8c0 .55.62.86 1.06.53l7.94-5.9a.66.66 0 0 0 0-1.06l-7.94-5.9c-.44-.33-1.06-.02-1.06.53z"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="flex items-center gap-2.5">
        <span class="ctrl-btn w-4 h-4 shrink-0 opacity-60">
          <svg viewBox="0 0 24 24"><path d="M13 4.6v14.8c0 .7-.83 1.07-1.35.6L7.2 16H4.5A1.5 1.5 0 0 1 3 14.5v-5A1.5 1.5 0 0 1 4.5 8h2.7l4.45-4c.52-.47 1.35-.1 1.35.6z"/></svg>
        </span>
        <div class="slider-wrap thin flex-1">
          <div class="slider-track"></div>
          <div class="slider-fill" id="volume-fill" style="width:50%"></div>
          <input class="slider-input" type="range" id="volume-slider" value="50" min="0" max="100">
        </div>
        <span class="ctrl-btn w-4 h-4 shrink-0 opacity-60">
          <svg viewBox="0 0 24 24"><path d="M10 4.6v14.8c0 .7-.83 1.07-1.35.6L4.2 16H1.5A1.5 1.5 0 0 1 0 14.5v-5A1.5 1.5 0 0 1 1.5 8h2.7l4.45-4c.52-.47 1.35-.1 1.35.6z"/><path d="M14.5 8.2a.9.9 0 0 1 1.27.1 5.6 5.6 0 0 1 0 7.4.9.9 0 0 1-1.36-1.18 3.8 3.8 0 0 0 0-5.04.9.9 0 0 1 .09-1.28z"/><path d="M17.8 5.3a.9.9 0 0 1 1.27.08 10 10 0 0 1 0 13.24.9.9 0 0 1-1.35-1.19 8.2 8.2 0 0 0 0-10.86.9.9 0 0 1 .08-1.27z"/></svg>
        </span>
      </div>

      <!-- Bottom icons (lyrics / AirPlay / queue) -->
      <div class="am-bottom-icons">
        <button class="ctrl-btn" type="button" aria-label="歌詞">
          <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.7 6.7-.2 1-.7 2-1.5 2.8-.3.3 0 .8.4.8 1.9-.2 3.5-1 4.6-1.9.9.2 1.9.4 2.8.4 5.5 0 10-3.9 10-8.8S17.5 3 12 3zm-4.5 9.9a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg>
        </button>
        <button class="ctrl-btn" type="button" aria-label="AirPlay">
          <svg viewBox="0 0 24 24"><path d="M4.5 4h15A2.5 2.5 0 0 1 22 6.5v8a2.5 2.5 0 0 1-2.5 2.5h-2.2l-1.7-2h3.9a.5.5 0 0 0 .5-.5v-8a.5.5 0 0 0-.5-.5h-15a.5.5 0 0 0-.5.5v8c0 .28.22.5.5.5h3.9l-1.7 2H4.5A2.5 2.5 0 0 1 2 14.5v-8A2.5 2.5 0 0 1 4.5 4z"/><path d="M11.4 14.7a.8.8 0 0 1 1.2 0l4.8 5.6c.45.52.08 1.32-.6 1.32H7.2c-.68 0-1.05-.8-.6-1.32l4.8-5.6z"/></svg>
        </button>
        <button class="ctrl-btn" type="button" aria-label="次に再生">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.2" rx="1.1"/><rect x="3" y="11" width="11" height="2.2" rx="1.1"/><rect x="3" y="17" width="11" height="2.2" rx="1.1"/><path d="M17.5 12.3v7.1c0 .5.55.8.97.53l3.1-2c.4-.26.4-.86 0-1.12l-3.1-2c-.42-.27-.97.02-.97.5z" transform="translate(0 -3.2)"/></svg>
        </button>
      </div>

      <!-- Copyright -->
      <div class="am-copyright" id="copyright-text">ⓒ 出典</div>

    </div>
  </div>

  <!-- ---- Right panel (controls) ---- -->
  <div class="glass-panel side-panel input-section absolute inset-y-0 right-0 flex flex-col w-[320px] p-6 overflow-y-auto max-md:static max-md:w-full max-md:max-w-sm">
    <div class="mb-6">
      <div class="flex items-center gap-2 mb-1">
        <div class="w-1.5 h-1.5 rounded-full bg-[#fa2d48]"></div>
        <h2 class="text-sm font-semibold text-white/90 tracking-wide uppercase">Apple Music</h2>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <div>
        <label class="field-label">Title</label>
        <input class="field-input" type="text" id="in-title" placeholder="タイトルまたはキャッチフレーズ">
      </div>
      <div>
        <label class="field-label">Artist</label>
        <input class="field-input" type="text" id="in-artist" placeholder="アーティスト名">
      </div>
      <div>
        <label class="field-label">Cover Image</label>
        <input class="file-input" type="file" id="in-image" accept="image/*">
      </div>
      <div>
        <label class="field-label">YouTube ID</label>
        <input class="field-input" type="text" id="in-youtube" placeholder="例: w2-uvGZCe3g">
        <p class="text-[11px] text-white/25 mt-1.5">URL の v= 以降の文字列</p>
      </div>
      <div>
        <label class="field-label">Copyright</label>
        <input class="field-input" type="text" id="in-copyright" placeholder="ⓒ 依頼主">
      </div>
    </div>

    <hr class="divider">

    <!-- Color pickers -->
    <div class="flex gap-3">
      <div class="flex-1">
        <label class="field-label">BG</label>
        <div class="color-picker-wrap">
          <input type="color" id="in-bg-color" value="#8e3b52">
        </div>
      </div>
      <div class="flex-1">
        <label class="field-label">Accent</label>
        <div class="color-picker-wrap">
          <input type="color" id="in-point-color" value="#ffffff">
        </div>
      </div>
      <div class="flex-1">
        <label class="field-label">Text</label>
        <div class="color-picker-wrap">
          <input type="color" id="in-text-color" value="#ffffff">
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="flex flex-col gap-2.5">
      <button class="btn-primary btn-apply" id="btn-update">適用してプレビュー</button>
      <button class="btn-primary btn-save" id="btn-capture">画像として保存</button>
    </div>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
